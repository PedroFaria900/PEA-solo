info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "maria@email.com",
        "password": "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let response = res.getBody();

        if (response.accessToken) {
          // Save the token to an environment variable named "token"
          bru.setEnvVar("token", response.accessToken);
          console.log("Token saved successfully!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
