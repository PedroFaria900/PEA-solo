info:
  name: buy-title
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/titulos"
  body:
    type: json
    data: |-
      {
        "tipo": "PASSE",
        "validade": "2026-12-31",
        "zonasIds": ["{{zonaAId}}"]
      }
  # Exemplos de uso:
  # PASSE numa zona:     tipo=PASSE, zonasIds=["<zonaAId>"], validade=...
  # PASSE interzona:     tipo=PASSE, zonasIds=["<zonaAId>","<zonaBId>"], validade=...
  # PASSE tudo:          tipo=PASSE, zonasIds=[], validade=...
  # PACK com zona:       tipo=PACK,  zonasIds=["<zonaAId>"], validade=..., viagens=10
  # BILHETE global:      tipo=BILHETE, zonasIds=[]
  # Todos os tipos usam 'zonasIds' (lista); lista vazia = passe-tudo (tarifário global).

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
