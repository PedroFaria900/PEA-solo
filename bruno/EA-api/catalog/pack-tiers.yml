info:
  name: pack-tiers
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/catalogo/pack-tiers"
  # Devolve a lista de tamanhos válidos para compra de um pack (ex: [5,10,20]).
  # Endpoint público. Use estes valores em viagens ao comprar POST /api/titulos com tipo=PACK.

  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
