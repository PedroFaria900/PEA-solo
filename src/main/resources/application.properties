# Aplicação
spring.application.name=bilhetica

# Base de dados
spring.datasource.url=jdbc:postgresql://localhost:5434/bilhetica
spring.datasource.username=bilhetica
spring.datasource.password=bilhetica123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Servidor
server.port=8080

# HikariCP — local single-instance default (k8s overrides via env vars)
spring.datasource.hikari.maximum-pool-size=20

# Batch remaining lazy loads into IN(...) groups — prevents residual N+1s
# (e.g. TituloPasse.zona, TituloBilhete.zonas) without query rewrites.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Pack tiers — tamanhos válidos de pack; alterável sem recompilar
bilhetica.pack.tiers=5,10,20

# Logs
logging.level.pt.uminho.mei.bilhetica=DEBUG
logging.level.org.springframework.security=DEBUG

# JWT
jwt.secret=bilhetica-secret-key-muito-longa-para-ser-segura-32chars
jwt.expiration=86400000

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
